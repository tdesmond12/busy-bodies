<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Busy Bodies — Workout Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f1113">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Busy Bodies">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1113; --panel:#181b1f; --panel2:#20242a; --line:#2b3037;
  --text:#eef1f4; --muted:#9aa3ad; --accent:#c6f432; --accent-ink:#151a05;
  --warn:#ffb547; --danger:#ff6b6b; --radius:14px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Barlow Condensed",Inter,sans-serif;letter-spacing:.02em;margin:0;text-transform:uppercase}
h1{font-size:26px;font-weight:800}
h2{font-size:22px;font-weight:700;margin-bottom:10px}
h3{font-size:18px;font-weight:700}
a{color:var(--accent)}
header{position:sticky;top:0;z-index:5;background:rgba(15,17,19,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{max-width:760px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:10px}
.logo{width:30px;height:30px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font:800 16px "Barlow Condensed"}
button.badge{background:none;font:inherit;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:7px;padding:4px 12px 4px 4px;color:var(--text)}
button.badge .av{width:26px;height:26px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--muted)}
button.badge.cloud .av{background:var(--accent);color:var(--accent-ink)}
button.badge.on{border-color:var(--accent)}
.ptabs{margin-bottom:14px}
.nbar .k{font-size:13px;font-weight:600;color:var(--muted)}
.nbar .track{height:9px;border-radius:99px;background:var(--panel2);margin-top:5px;overflow:hidden}
.nbar .fill{height:100%;background:#7fb3ff;border-radius:99px;transition:width .3s}
.nbar .fill.done{background:var(--accent)}
.water-big{font:800 46px "Barlow Condensed";text-align:center;margin:6px 0 10px}
.water-big span{font-size:20px;color:var(--muted)}
.meal{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.x{background:none;border:0;color:var(--muted);font-size:22px;cursor:pointer;padding:0 6px}
.star{background:none;border:0;color:var(--muted);font-size:20px;cursor:pointer;padding:0 4px}
.star.on{color:var(--accent)}
.favs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.fav{position:relative;flex:none;max-width:170px;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px 11px;color:var(--text);font:inherit;cursor:pointer}
.fav b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fav span{font-size:12px;color:var(--muted)}
.fav i{position:absolute;top:-7px;right:-7px;width:20px;height:20px;border-radius:50%;background:var(--danger);color:#fff;font-style:normal;font-size:14px;display:grid;place-items:center}
.photo-btn{text-align:center}
.photo-btn.disabled{opacity:.5}
.scan{margin-top:12px;padding:12px;border-radius:12px;background:var(--panel2)}
.scan input[type=text],.scan input[type=number]{background:var(--panel);margin-top:4px}
.scanimg{width:100%;max-height:220px;object-fit:cover;border-radius:10px;display:block}

.badge{margin-left:auto;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:3px 10px;white-space:nowrap}
.badge.cloud{color:var(--accent);border-color:rgba(198,244,50,.35)}
main{max-width:760px;margin:0 auto;padding:16px 16px 110px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;background:rgba(20,23,26,.97);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .inner{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px 11px;color:var(--muted);text-decoration:none;font-size:12px;font-weight:600}
nav.tabs a svg{width:22px;height:22px}
nav.tabs a.on{color:var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:14px 0 6px}
input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:11px 12px;font:inherit;font-size:16px}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(198,244,50,.5);border-color:transparent}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{flex:1 1 auto;text-align:center;padding:10px 12px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);cursor:pointer;font-weight:600;font-size:14px;min-width:54px}
.seg input:checked+label{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.seg input:focus-visible+label{outline:2px solid #fff}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.checks label{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);cursor:pointer;font-size:14px;font-weight:600}
.checks input{width:18px;height:18px;accent-color:var(--accent);flex:none}
.checks label:has(input:checked){border-color:var(--accent);color:var(--accent)}
.choices input{position:absolute;opacity:0;pointer-events:none}
.choices label{display:block;padding:12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);cursor:pointer}
.choices label b{display:block;font-size:14px}
.choices label span{font-size:12px;color:var(--muted)}
.choices input:checked+label{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.choices input:checked+label b{color:var(--accent)}
.toggle{display:flex;align-items:center;gap:10px;margin-top:14px;cursor:pointer}
.toggle input{width:20px;height:20px;accent-color:var(--accent)}
.btn{appearance:none;border:0;border-radius:11px;padding:12px 16px;font:600 15px Inter,sans-serif;cursor:pointer;background:var(--panel2);color:var(--text);border:1px solid var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.block{width:100%}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:9px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:560px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--panel2);border-radius:12px;padding:12px}
.stat .k{font-size:12px;color:var(--muted);font-weight:600}
.stat .v{font:700 26px "Barlow Condensed";margin-top:2px}
.stat .s{font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
.chip.on{color:var(--accent);border-color:rgba(198,244,50,.35)}
.day{padding:0;overflow:hidden}
.dayhead{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.dow{font:800 15px "Barlow Condensed";background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:4px 8px;text-transform:uppercase}
.note{padding:10px 16px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line)}
.note b{color:var(--text)}
.ex{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-bottom:1px solid var(--line)}
.ex:last-of-type{border-bottom:0}
.ex .num{font:700 15px "Barlow Condensed";color:var(--muted);width:18px;padding-top:2px}
.ex .body{flex:1;min-width:0}
.ex .name{font-weight:600}
.ex .rx{font-size:13px;color:var(--accent);font-weight:600}
.ex .cue{font-size:13px;color:var(--muted);margin-top:3px}
.iconbtn{background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:9px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn svg{width:18px;height:18px}
.dayfoot{padding:12px 16px;display:flex;gap:8px}
.logex{background:var(--panel2);border-radius:12px;padding:12px;margin-bottom:10px}
.logex .top{display:flex;align-items:flex-start;gap:8px;margin-bottom:8px}
.logex .top .t{flex:1}
.sets{display:grid;gap:6px}
.setrow{display:grid;grid-template-columns:34px 1fr 1fr 34px;gap:6px;align-items:center}
.setrow.one{grid-template-columns:34px 1fr 34px}
.setrow .n{font:700 14px "Barlow Condensed";color:var(--muted);text-align:center}
.setrow input{padding:9px 10px}
.setrow .x{background:none;border:0;color:var(--muted);font-size:20px;cursor:pointer}
.hint{font-size:12px;color:var(--muted)}
.hist{border-bottom:1px solid var(--line);padding:12px 0}
.hist:last-child{border-bottom:0}
.hist summary{list-style:none;cursor:pointer;display:flex;gap:10px;align-items:center}
.hist summary::-webkit-details-marker{display:none}
.hist .d{font:700 15px "Barlow Condensed";background:var(--panel2);border-radius:8px;padding:6px 8px;text-align:center;min-width:52px;line-height:1.1}
.hist .detail{margin:10px 0 0 62px;font-size:13px;color:var(--muted)}
.hist .detail div{margin-bottom:3px}
table.pr{width:100%;border-collapse:collapse;font-size:14px}
table.pr th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:6px 4px;border-bottom:1px solid var(--line)}
table.pr td{padding:8px 4px;border-bottom:1px solid var(--line)}
table.pr td.n{text-align:right;font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);font-weight:600;padding:10px 16px;border-radius:99px;opacity:0;transition:.25s;z-index:20;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.loading{display:grid;place-items:center;min-height:50vh;color:var(--muted)}
.disclaimer{font-size:12px;color:var(--muted);margin-top:8px}
.hero{background:linear-gradient(135deg,#1c2410,#181b1f 60%);border-color:#2f3a17}
/* coach */
.chat{display:flex;flex-direction:column;gap:10px;padding-bottom:150px}
.msg{max-width:88%;padding:10px 13px;border-radius:16px;line-height:1.45;font-size:15px;word-wrap:break-word}
.msg.model{background:var(--panel);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:5px}
.msg.user{background:var(--accent);color:var(--accent-ink);align-self:flex-end;border-bottom-right-radius:5px}
.msg ul{margin:6px 0;padding-left:18px}
.msg .acts{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.msg .acts .btn{text-align:left}
.msg .acts .done{font-size:13px;color:var(--accent)}
.typing{align-self:flex-start;color:var(--muted);font-size:13px;padding:4px 6px}
.composer{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));z-index:6;background:linear-gradient(transparent,var(--bg) 18%);padding:14px 12px 10px}
.composer .inner{max-width:760px;margin:0 auto}
.composer .chips{margin-bottom:8px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.composer .chip{cursor:pointer;white-space:nowrap;background:var(--panel)}
.composer form{display:flex;gap:8px;align-items:flex-end}
.composer textarea{min-height:44px;max-height:120px;border-radius:22px;padding:11px 16px;resize:none}
.composer button{border-radius:50%;width:44px;height:44px;padding:0;display:grid;place-items:center;flex:none}
.signin{text-align:center;padding:28px 18px}
.gbtn{display:inline-flex;align-items:center;gap:10px;background:#fff;color:#1f1f1f;border-color:#fff}
</style>
</head>
<body>
<header><div class="bar"><div class="logo">BB</div><h1>Busy Bodies</h1><button class="badge" id="badge" type="button">Loading…</button></div></header>
<main id="app"><div class="loading">Loading your data…</div></main>
<nav class="tabs"><div class="inner">
  <a href="#nutrition" data-tab="nutrition"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2.6"/><path d="M2.5 3v18M1 3v4a1.5 1.5 0 0 0 3 0V3M21.5 21V3c-1.6 1-2.2 3-2.2 6.5h2.2"/></svg>Nutrition</a>
  <a href="#plan" data-tab="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Plan</a>
  <a href="#log" data-tab="log"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 8v8M18 8v8M3 10v4M21 10v4M6 12h12"/></svg>Log</a>
  <a href="#coach" data-tab="coach"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M8.5 11h.01M12 11h.01M15.5 11h.01"/></svg>Coach</a>
  <a href="#progress" data-tab="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Progress</a>
</div></nav>
<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   Busy Bodies — single-person workout tracker
   Sections: utils · exercise library · plan engine · calorie math ·
             storage (swap-ready for Firestore) · views · init
   ===================================================================== */

// ---------- utils ----------
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayStr = () => { const d=new Date(); return ymd(d); };
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parseYmd = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const weekStart = d => { const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); const off=(x.getDay()+6)%7; x.setDate(x.getDate()-off); return x; };
const num = v => { const n=parseFloat(v); return isFinite(n)?n:0; };
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2600); }
const withTimeout = (p, ms) => Promise.race([p, new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),ms))]);

// ---------- exercise library ----------
// p = movement pattern, eq = none | db | gym, lvl = 1 beginner … 3 advanced, h = high impact, t = timed (seconds)
const EX = [];
function E(name,p,eq,lvl,cue,flags=''){ EX.push({id:name.toLowerCase().replace(/[^a-z0-9]+/g,'-'),name,p,eq,lvl,cue,h:flags.includes('h'),t:flags.includes('t')}); }
// Squat
E('Bodyweight Squat','squat','none',1,'Feet shoulder-width, sit hips back and down, chest up, drive through the whole foot.');
E('Box Squat to Chair','squat','none',1,'Sit back to a sturdy chair, tap it lightly, and stand without rocking.');
E('Jump Squat','squat','none',2,'Squat down, jump up, and land softly with knees bent.','h');
E('Goblet Squat','squat','db',1,'Hold one dumbbell at your chest and sit down between your heels.');
E('Dumbbell Front Squat','squat','db',2,'Dumbbells resting on shoulders, elbows high, squat to a depth you control.');
E('Leg Press','squat','gym',1,'Feet mid-platform; lower until knees reach about 90° and don’t slam the lockout.');
E('Barbell Back Squat','squat','gym',2,'Bar on upper back, brace your core, squat to parallel with control.');
E('Barbell Front Squat','squat','gym',3,'Bar across the front of your shoulders, elbows up, stay tall.');
// Hinge
E('Glute Bridge','hinge','none',1,'On your back, feet flat; squeeze glutes to lift hips and pause at the top.');
E('Bodyweight Good Morning','hinge','none',1,'Hands behind head, soft knees, push hips back with a flat back.');
E('Single-Leg Glute Bridge','hinge','none',2,'One foot planted, other leg up; drive through the heel and keep hips level.');
E('Dumbbell Romanian Deadlift','hinge','db',1,'Soft knees, push hips back, slide the dumbbells down your thighs until hamstrings stretch.');
E('Dumbbell Hip Thrust','hinge','db',2,'Upper back on a bench or couch, dumbbell on hips, drive hips to full extension.');
E('Single-Leg Dumbbell RDL','hinge','db',3,'Hinge on one leg, back leg reaching behind, hips square.');
E('Back Extension','hinge','gym',1,'Hinge at the hips over the pad, rise until your body is in a straight line.');
E('Barbell Romanian Deadlift','hinge','gym',2,'Bar close to legs, hips back, stop when your hamstrings are fully stretched.');
E('Conventional Deadlift','hinge','gym',2,'Bar over mid-foot, flat back, push the floor away and stand tall.');
// Lunge / single leg
E('Reverse Lunge','lunge','none',1,'Step back, lower the back knee toward the floor, push through the front heel.');
E('Split Squat','lunge','none',1,'Staggered stance, drop straight down, keep the front knee tracking over toes.');
E('Jumping Lunge','lunge','none',3,'Lunge, jump and switch legs in the air, land softly.','h');
E('Dumbbell Step-Up','lunge','db',1,'Step onto a sturdy box or stair, drive through the top foot, control the way down.');
E('Dumbbell Walking Lunge','lunge','db',2,'Long steps, back knee kisses the floor, torso tall.');
E('Bulgarian Split Squat','lunge','db',2,'Rear foot on a bench, lower straight down on the front leg.');
E('Barbell Reverse Lunge','lunge','gym',3,'Bar on back, step back under control, keep the torso upright.');
// Horizontal push
E('Incline Push-Up','push_h','none',1,'Hands on a counter or bench, body straight, lower chest to the edge.');
E('Push-Up','push_h','none',2,'Hands under shoulders, body in a straight line, chest to just above the floor.');
E('Decline Push-Up','push_h','none',3,'Feet elevated on a step or bench; keep your core tight.');
E('Dumbbell Floor Press','push_h','db',1,'On your back, press dumbbells up; elbows touch the floor at the bottom.');
E('Dumbbell Bench Press','push_h','db',1,'Shoulder blades pinched, lower dumbbells to chest level, press up.');
E('Incline Dumbbell Press','push_h','db',2,'Bench at 30–45°, press up and slightly back.');
E('Machine Chest Press','push_h','gym',1,'Handles at mid-chest, press out smoothly, don’t lock elbows hard.');
E('Barbell Bench Press','push_h','gym',2,'Feet planted, bar to lower chest, press back over shoulders.');
// Vertical push
E('Pike Push-Up','push_v','none',1,'Hips high in an upside-down V, lower your head toward the floor. Start shallow.');
E('Dumbbell Shoulder Press','push_v','db',1,'Seated or standing, press dumbbells overhead without arching your low back.');
E('Arnold Press','push_v','db',2,'Start palms facing you, rotate out as you press overhead.');
E('Half-Kneeling Single-Arm Press','push_v','db',2,'One knee down, squeeze that glute, press one dumbbell overhead.');
E('Machine Shoulder Press','push_v','gym',1,'Handles at shoulder height, press up, control down.');
E('Barbell Overhead Press','push_v','gym',2,'Squeeze glutes, press the bar overhead, move your head through at the top.');
// Horizontal pull
E('Prone Y-T-W Raise','pull_h','none',1,'Face-down, lift arms into Y, T and W shapes, squeezing your shoulder blades.');
E('Inverted Table Row','pull_h','none',2,'Under a sturdy table that can’t tip, grip the edge and pull your chest up.');
E('One-Arm Dumbbell Row','pull_h','db',1,'Hand and knee on a bench, pull the dumbbell to your hip.');
E('Chest-Supported Dumbbell Row','pull_h','db',1,'Chest on an incline bench, row both dumbbells, squeeze your back.');
E('Seated Cable Row','pull_h','gym',1,'Sit tall, pull the handle to your stomach, shoulders down.');
E('Barbell Bent-Over Row','pull_h','gym',2,'Hinge to about 45°, pull the bar to your lower ribs.');

// ---------- equipment + activities ----------
const GEAR = {
  dumbbells:'Dumbbells', bench:'Workout bench', kettlebell:'Kettlebell', bands:'Resistance bands',
  pullup:'Pull-up bar', barbell:'Barbell & rack', machines:'Weight machines', cable:'Cable machine',
};
const ACTIVITIES = {
  walk:'Walking', run:'Running', bike:'Cycling', swim:'Swimming', stairs:'Stairs', jumprope:'Jump rope',
  treadmill:'Treadmill', elliptical:'Elliptical', rower:'Rowing machine',
};
const GEAR_PRESETS = {
  none:{label:'Bodyweight only', gear:[], activities:['walk','stairs']},
  home:{label:'Home with dumbbells', gear:['dumbbells','bench'], activities:['walk','stairs']},
  gym:{label:'Full gym', gear:['dumbbells','bench','kettlebell','pullup','barbell','machines','cable'], activities:['walk','treadmill','bike','elliptical','rower','stairs']},
};
// What each exercise needs. Unlisted: none → nothing, db → dumbbells, bands → bands, kb → kettlebell, bar → pull-up bar.
const NEEDS = {
  'dumbbell-bench-press':['dumbbells','bench'], 'incline-dumbbell-press':['dumbbells','bench'], 'chest-supported-dumbbell-row':['dumbbells','bench'], 'dumbbell-pullover':['dumbbells','bench'],
  'leg-press':['machines'], 'back-extension':['machines'], 'machine-chest-press':['machines'], 'machine-shoulder-press':['machines'], 'assisted-pull-up':['machines'], 'seated-calf-raise-machine':['machines'],
  'barbell-back-squat':['barbell'], 'barbell-front-squat':['barbell'], 'barbell-romanian-deadlift':['barbell'], 'conventional-deadlift':['barbell'], 'barbell-reverse-lunge':['barbell'], 'barbell-overhead-press':['barbell'], 'barbell-bent-over-row':['barbell'], 'barbell-bench-press':['barbell','bench'],
  'seated-cable-row':['cable'], 'lat-pulldown':['cable'], 'cable-face-pull':['cable'], 'cable-curl':['cable'], 'cable-triceps-pushdown':['cable'], 'cable-pallof-press':['cable'],
  'pull-up':['pullup'], 'hanging-knee-raise':['pullup'],
  // cardio needs an activity
  'brisk-or-incline-walk':['walk'], 'stair-climbing':['stairs'], 'jog-or-run':['run'], 'jump-rope':['jumprope'], 'stationary-bike':['bike'], 'outdoor-bike-ride':['bike'],
  'elliptical':['elliptical'], 'rowing-machine':['rower'], 'treadmill-incline-walk':['treadmill'], 'swimming':['swim'], 'cardio-of-your-choice':[],
};
const DEFAULT_NEEDS = {none:[], db:['dumbbells'], bands:['bands'], kb:['kettlebell'], bar:['pullup'], gym:['machines']};
for(const e of EX) e.needs = NEEDS[e.id] || DEFAULT_NEEDS[e.eq] || [];
const GEAR_RANK = {barbell:2, machines:2, cable:2, dumbbells:1, kettlebell:1, bands:1, pullup:1, bench:0};
const exRank = e => Math.max(0, ...e.needs.map(n=>GEAR_RANK[n]||0));
// Everything the user has: equipment + activities.
const haveSet = p => new Set([...(p.gear||[]), ...(p.activities||[])]);
const canDo = (e, p, have=haveSet(p)) => e.needs.every(n=>have.has(n));
// Older profiles stored one of none | db | gym; turn that into checklists.
function withGear(p){
  if(!p || (Array.isArray(p.gear) && Array.isArray(p.activities))) return p;
  const preset = GEAR_PRESETS[{none:'none', db:'home', gym:'gym'}[p.equipment] || 'gym'];
  p.gear = Array.isArray(p.gear) ? p.gear : [...preset.gear];
  p.activities = Array.isArray(p.activities) ? p.activities : [...preset.activities];
  return p;
}
const gearSummary = p => { const g=(p.gear||[]).map(k=>GEAR[k]).filter(Boolean); return g.length ? (g.length>3 ? `${g.length} pieces of equipment` : g.join(', ')) : 'Bodyweight only'; };

const EXBY = Object.fromEntries(EX.map(e=>[e.id,e]));
const COMPOUND = new Set(['squat','hinge','lunge','push_h','push_v','pull_h','pull_v']);
const PATTERN_LABEL = {squat:'Squat',hinge:'Hinge',lunge:'Single-leg',push_h:'Chest push',push_v:'Overhead push',pull_h:'Row',pull_v:'Vertical pull',shoulders:'Shoulders',biceps:'Biceps',triceps:'Triceps',calves:'Calves',core:'Core',cardio:'Cardio'};

// ---------- plan engine ----------
const GOALS = {
  fat_loss:{label:'Lose fat',sub:'Burn calories, keep muscle'},
  muscle:{label:'Build muscle',sub:'Size and shape'},
  strength:{label:'Get stronger',sub:'Lift heavier'},
  endurance:{label:'Endurance',sub:'Stamina and heart health'},
  general:{label:'General fitness',sub:'Feel better overall'},
};
const LEVELS = {1:'Beginner',2:'Intermediate',3:'Advanced'};

const TEMPLATES = {
  fullA:{name:'Full Body A',slots:['squat','push_h','pull_h','hinge','shoulders','core']},
  fullB:{name:'Full Body B',slots:['hinge','push_v','pull_v','lunge','biceps','core']},
  fullC:{name:'Full Body C',slots:['lunge','push_h','pull_h','squat','triceps','core']},
  upperA:{name:'Upper Body A',slots:['push_h','pull_h','push_v','pull_v','triceps','biceps']},
  upperB:{name:'Upper Body B',slots:['push_v','pull_v','push_h','pull_h','shoulders','core']},
  lowerA:{name:'Lower Body A',slots:['squat','hinge','lunge','calves','core','core']},
  lowerB:{name:'Lower Body B',slots:['hinge','squat','lunge','calves','core','core']},
  push:{name:'Push',slots:['push_h','push_v','push_h','shoulders','triceps','core']},
  pull:{name:'Pull',slots:['pull_v','pull_h','pull_h','shoulders','biceps','core']},
  legs:{name:'Legs',slots:['squat','hinge','lunge','calves','core','core']},
  cardio:{name:'Cardio + Core',slots:['cardio','core','core']},
};
const WEEKDAYS = {2:['Mon','Thu'],3:['Mon','Wed','Fri'],4:['Mon','Tue','Thu','Fri'],5:['Mon','Tue','Wed','Fri','Sat'],6:['Mon','Tue','Wed','Thu','Fri','Sat']};
function splitFor(days, goal){
  if(goal==='endurance') return ['fullA','cardio','fullB','cardio','fullC','cardio'].slice(0,days);
  return {2:['fullA','fullB'],3:['fullA','fullB','fullC'],4:['upperA','lowerA','upperB','lowerB'],5:['upperA','lowerA','push','pull','legs'],6:['push','pull','legs','push','pull','legs']}[days];
}
function pick(pattern, p, rng, used){
  const have = haveSet(p), lvl = +p.level;
  const maxEq = Math.max(0, ...[...have].map(n=>GEAR_RANK[n]||0));
  // only exercises the user has the equipment / activity for — never relaxed
  const avail = EX.filter(e=>e.p===pattern && canDo(e,p,have) && e.id!=='cardio-of-your-choice');
  let c = avail.filter(e=>!(p.lowImpact && e.h));
  if(!c.length) c = avail;
  if(!c.length) return pattern==='cardio' ? EXBY['cardio-of-your-choice'] : null;
  let fresh = c.filter(e=>!used.has(e.id));
  if(fresh.length) c = fresh;
  const fit = c.filter(e=>e.lvl<=lvl);
  if(fit.length) c = fit;
  let best=null, bs=-1;
  for(const e of c){
    // prefer exercises that use the best equipment available and match the experience level
    const r = exRank(e);
    const eqScore = (pattern==='core'||pattern==='calves'||pattern==='cardio') ? 0 : (r===maxEq?2:r===maxEq-1?1:0);
    const lvScore = e.lvl===lvl?1.5:e.lvl===lvl-1?1:0;
    const s = eqScore + lvScore + rng()*1.8;
    if(s>bs){bs=s;best=e;}
  }
  return best;
}
const exCap = mins => ({30:4,45:5,60:6}[mins]||5);
function buildPlan(p, seed){
  const rng = mulberry32(seed), keys = splitFor(+p.days,p.goal), wd = WEEKDAYS[p.days], cap = exCap(+p.minutes);
  const days = keys.map((k,i)=>{
    const t = TEMPLATES[k], used = new Set();
    const slots = k==='cardio' ? t.slots : t.slots.slice(0,cap);
    const exercises = slots.map(pat=>{ const e=pick(pat,p,rng,used); if(!e) return null; used.add(e.id); return e.id; }).filter(Boolean);
    return {key:k,name:t.name,weekday:wd[i],exercises};
  });
  return {seed, createdAt:Date.now(), sig:planSig(p), days};
}
const planSig = p => [p.goal,p.level,p.days,p.minutes,[...(p.gear||[])].sort().join('+'),[...(p.activities||[])].sort().join('+'),!!p.lowImpact].join('|');

function rx(ex, p){
  const goal=p.goal, lvl=+p.level, comp=COMPOUND.has(ex.p);
  if(ex.p==='cardio') return {sets:1, text: goal==='endurance' ? '30–40 min · easy to moderate' : '20 min · steady', kind:'cardio'};
  if(ex.t){ const sec = goal==='endurance'?45:[0,20,30,45][lvl]; const sets=lvl===1?2:3; return {sets, text:`${sets} × ${sec} sec · rest 30–45 sec`, kind:'timed'}; }
  let s,r,rest;
  switch(goal){
    case 'strength': [s,r,rest] = comp ? [lvl===1?3:5,'5','2–3 min'] : [3,'8–10','90 sec']; break;
    case 'muscle':   [s,r,rest] = comp ? [lvl===1?3:4,'8–10','90 sec'] : [3,'10–15','60 sec']; break;
    case 'fat_loss': [s,r,rest] = [3, comp?'10–12':'12–15','45 sec']; break;
    case 'endurance':[s,r,rest] = [lvl===1?2:3,'15–20','30 sec']; break;
    default:         [s,r,rest] = [lvl===1?2:3,'10–12','60 sec'];
  }
  if(ex.p==='core' && goal==='strength') r='10–12';
  return {sets:s, text:`${s} × ${r} · rest ${rest}`, kind:'reps'};
}
function dayNotes(day, p){
  const warm = `<b>Warm-up:</b> ${p.age>=50?'8–10':'5'} min easy cardio, then leg swings, arm circles and hip openers.`;
  if(day.key==='cardio') return [warm.replace('easy cardio, then','easy pace, then'), `<b>Tip:</b> Keep cardio at a pace where you could hold a conversation.`];
  const out=[warm];
  if(p.goal==='fat_loss') out.push('<b>Finisher:</b> 15–20 min cardio after lifting (incline walk, bike or rower).');
  if(p.goal==='endurance') out.push('<b>Circuit style:</b> go exercise to exercise, rest 1–2 min after each full round.');
  if(p.goal==='general') out.push('<b>Optional:</b> 10 min easy cardio to finish.');
  if(p.goal==='strength') out.push('<b>Load:</b> pick weights where the last rep is hard but clean; add 5 lb when you hit every rep.');
  if(p.goal==='muscle') out.push('<b>Effort:</b> stop 1–2 reps short of failure; add weight once you hit the top of the rep range.');
  return out;
}

// ---------- body + calorie math (estimates) ----------
function bodyStats(p){
  const kg = p.weight*0.4536, cm = (p.heightFt*12 + +p.heightIn)*2.54, inches = p.heightFt*12 + +p.heightIn;
  const bmi = p.weight/(inches*inches)*703;
  const bmr = 10*kg + 6.25*cm - 5*p.age + (p.sex==='male'?5:-161);
  const act = p.days<=2?1.375:p.days<=4?1.55:1.725;
  const tdee = bmr*act;
  let target = tdee;
  if(p.goal==='fat_loss') target = Math.max(tdee-500, p.sex==='male'?1500:1200);
  if(p.goal==='muscle') target = tdee+300;
  const bmiCat = bmi<18.5?'Underweight':bmi<25?'Healthy range':bmi<30?'Overweight':'Obese range';
  return {bmi, bmiCat, bmr, tdee, target, proteinLo:Math.round(p.weight*0.7), proteinHi:Math.round(p.weight*1.0)};
}

// ---------- storage ----------
// Every read/write goes through `store`, so the app never touches storage directly.
//   localBackend     → this browser only (used when signed out)
//   firestoreBackend → the signed-in user's Firestore data:
//                      users/{uid}                 profile + plan
//                      users/{uid}/workouts/{id}   one doc per workout
//                      users/{uid}/coach/chat      coach conversation
//                      users/{uid}/days/{date}     nutrition: water, meals, supplements taken
function localBackend(){
  const get = k => { try{ return JSON.parse(localStorage.getItem(k)); }catch{ return null; } };
  const set = (k,v) => { try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} };
  return {
    kind:'local',
    async load(){},
    async getAccount(){ return get('rr.account') || {}; },
    async saveAccount(a){ set('rr.account', a); },
    async listWorkouts(){ return (get('rr.workouts')||[]).sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt-a.createdAt); },
    async addWorkout(w){ const all=get('rr.workouts')||[]; const id='w'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); all.push({...w,id}); set('rr.workouts',all); return id; },
    async deleteWorkout(id){ set('rr.workouts',(get('rr.workouts')||[]).filter(w=>w.id!==id)); },
    async replaceAll(account, workouts){ set('rr.account', account); set('rr.workouts', workouts); },
    async getChat(){ return []; },
    async saveChat(){},
    async getDay(date){ return (get('rr.days')||{})[date] || null; },
    async saveDay(date, data){ const all=get('rr.days')||{}; all[date]=data; set('rr.days', all); },
    async listDays(){ return get('rr.days')||{}; },
    async clearDays(){ set('rr.days', {}); },
  };
}
const clean = o => JSON.parse(JSON.stringify(o ?? null)); // Firestore rejects undefined
function firestoreBackend(F, db, uid){
  const userRef = F.doc(db,'users',uid);
  const wCol = F.collection(db,'users',uid,'workouts');
  const chatRef = F.doc(db,'users',uid,'coach','chat');
  const dCol = F.collection(db,'users',uid,'days');
  const sortW = a => a.sort((x,y)=>y.date.localeCompare(x.date)||y.createdAt-x.createdAt);
  return {
    kind:'cloud',
    async getAccount(){ const s=await F.getDoc(userRef); return s.exists() ? s.data() : {}; },
    async saveAccount(a){ await F.setDoc(userRef, clean(a)); },
    async listWorkouts(){ const s=await F.getDocs(wCol); return sortW(s.docs.map(d=>({...d.data(), id:d.id}))); },
    async addWorkout(w){ const {id, ...rest} = w; const r=await F.addDoc(wCol, clean(rest)); return r.id; },
    async deleteWorkout(id){ await F.deleteDoc(F.doc(wCol,id)); },
    async replaceAll(account, workouts){
      const old = await F.getDocs(wCol);
      const ops = [...old.docs.map(d=>b=>b.delete(d.ref)), ...workouts.map(w=>b=>{ const {id,...rest}=w; b.set(F.doc(wCol), clean(rest)); })];
      for(let i=0;i<ops.length;i+=400){ const b=F.writeBatch(db); ops.slice(i,i+400).forEach(op=>op(b)); await b.commit(); }
      await F.setDoc(userRef, clean(account));
    },
    async getChat(){ const s=await F.getDoc(chatRef); return s.exists() ? (s.data().messages||[]) : []; },
    async saveChat(m){ await F.setDoc(chatRef, {messages: clean(m.slice(-60))}); },
    async getDay(date){ const s=await F.getDoc(F.doc(dCol,date)); return s.exists() ? s.data() : null; },
    async saveDay(date, data){ await F.setDoc(F.doc(dCol,date), clean(data)); },
    async listDays(){ const s=await F.getDocs(dCol); return Object.fromEntries(s.docs.map(d=>[d.id, d.data()])); },
    async clearDays(){ const s=await F.getDocs(dCol); for(let i=0;i<s.docs.length;i+=400){ const b=F.writeBatch(db); s.docs.slice(i,i+400).forEach(d=>b.delete(d.ref)); await b.commit(); } },
  };
}

const PROFILE_DEFAULTS = {sex:'male',goal:'general',level:1,days:3,minutes:45,gear:[...GEAR_PRESETS.gym.gear],activities:[...GEAR_PRESETS.gym.activities],lowImpact:false,heightFt:5,heightIn:9};
// Validates and normalizes a profile (used by the form and by the coach).
function normalizeProfile(raw){
  const r = {...PROFILE_DEFAULTS, ...withGear({...(raw||{})})};
  const pickOne = (v, allowed, d) => allowed.includes(v) ? v : d;
  const p = {
    name: String(r.name||'').trim().slice(0,40),
    age: Math.round(num(r.age)), weight: Math.round(num(r.weight)),
    heightFt: Math.round(num(r.heightFt)), heightIn: Math.round(num(r.heightIn)),
    sex: pickOne(String(r.sex).toLowerCase(), ['male','female'], 'male'),
    goal: pickOne(r.goal, Object.keys(GOALS), 'general'),
    level: pickOne(+r.level, [1,2,3], 1),
    days: pickOne(+r.days, [2,3,4,5,6], 3),
    minutes: pickOne(+r.minutes, [30,45,60], 45),
    gear: [...new Set((Array.isArray(r.gear)?r.gear:[]).filter(k=>k in GEAR))],
    activities: [...new Set((Array.isArray(r.activities)?r.activities:[]).filter(k=>k in ACTIVITIES))],
    lowImpact: r.lowImpact===true || r.lowImpact==='true' || r.lowImpact==='on',
    notes: String(r.notes||'').trim().slice(0,600),
  };
  if(p.heightIn>11){ p.heightFt += Math.floor(p.heightIn/12); p.heightIn %= 12; }
  const err = [];
  if(!(p.age>=16 && p.age<=90)) err.push('age (16–90)');
  if(!(p.weight>=70 && p.weight<=600)) err.push('weight in pounds');
  if(!(p.heightFt>=4 && p.heightFt<=7)) err.push('height');
  return {p, err};
}
// Saves a profile and rebuilds the plan if anything plan-related changed.
async function applyProfile(np){
  const hadPlan = !!plan();
  const changed = !hadPlan || plan().sig !== planSig(np);
  S.account.profile = {...np, updatedAt:Date.now()};
  if(changed) S.account.plan = buildPlan(np, hadPlan ? plan().seed : Math.floor(Math.random()*1e9));
  await saveAccount();
  renderBadge();
  return {hadPlan, changed};
}

// ----- AI JSON helper -----
function parseJSON(text){ const t=String(text||'').trim().replace(/^```(?:json)?\s*/i,'').replace(/```$/,'').trim(); return JSON.parse(t); }
function aiErrorMessage(e){
  const m = String(e && e.message || e);
  return /high demand|overloaded|\b50[0-9]\b|UNAVAILABLE/i.test(m) ? 'Google’s AI is busy right now — try again in a minute.' :
         /no reply|timeout/i.test(m) ? 'The AI took too long — try again.' :
         /quota|429|RESOURCE_EXHAUSTED/i.test(m) ? 'Free AI limit reached for now — try again later.' :
         /app.?check/i.test(m) ? 'AI is blocked by App Check — check the Firebase setup.' :
         'Couldn’t reach the AI — check your connection and try again.';
}

// ----- photo scanning -----
async function shrinkImage(file, max=1024){
  const url = URL.createObjectURL(file);
  try{
    const img = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>rej(new Error('Couldn’t read that image')); i.src=url; });
    const scale = Math.min(1, max/Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth*scale); c.height = Math.round(img.naturalHeight*scale);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    const dataUrl = c.toDataURL('image/jpeg', 0.82);
    return { dataUrl, b64: dataUrl.split(',')[1] };
  } finally { URL.revokeObjectURL(url); }
}
const SCAN_PROMPT = `You estimate nutrition from a photo of food for a meal-tracking app.
Identify each food item and estimate its portion size from visual cues (plate size, utensils, hands). Then estimate calories and macros for the portion shown.
Be realistic, not optimistic: include cooking oils, sauces, dressings and drinks you can see.
If the photo is not food, set "isFood" to false.
Respond with ONLY JSON:
{"isFood": true, "name": "<short meal name, e.g. Grilled chicken salad>", "items": [{"food": "...", "portion": "e.g. 1 cup / 6 oz", "cal": 0, "protein": 0}], "cal": <total>, "protein": <total g>, "carbs": <total g>, "fat": <total g>, "confidence": "low|medium|high", "note": "<one short sentence: what was hard to judge, or a tip>"}`;
async function scanMeal(file){
  S.scan = { status:'loading' }; S.rerenderNutrition?.();
  try{
    const img = await shrinkImage(file);
    S.scan.preview = img.dataUrl; S.rerenderNutrition?.();
    const text = await askAI([{role:'user', parts:[{text:'Estimate the nutrition of this meal.'}, {inlineData:{mimeType:'image/jpeg', data:img.b64}}]}], SCAN_PROMPT, 45000);
    const r = parseJSON(text);
    if(r.isFood===false){ S.scan = {status:'error', preview:img.dataUrl, msg:'That doesn’t look like food — try another photo.'}; }
    else S.scan = { status:'done', preview:img.dataUrl, name:String(r.name||'Meal').slice(0,80), cal:Math.round(num(r.cal)), protein:Math.round(num(r.protein)), carbs:Math.round(num(r.carbs)), fat:Math.round(num(r.fat)),
      items: Array.isArray(r.items)?r.items.slice(0,10):[], confidence:r.confidence||'medium', note:String(r.note||'').slice(0,200) };
  }catch(e){ console.error(e); S.scan = { status:'error', preview:S.scan&&S.scan.preview, msg: e instanceof SyntaxError ? 'Couldn’t read the AI’s answer — try again.' : aiErrorMessage(e) }; }
  if(location.hash==='#nutrition') S.rerenderNutrition?.();
}

function profileFormSave(formEl, fields){

// ----- logging -----
function blankSets(ex, n){ return Array.from({length:n},()=>({w:'',r:''})); }
function startDraft(dayIdx){
  const p = profile();
  const day = dayIdx!=null && plan() ? plan().days[dayIdx] : null;
  S.draft = {
    dayIdx, dayName: day?day.name:'Custom workout', date: todayStr(),
    exercises: day ? day.exercises.filter(id=>EXBY[id]).map(id=>({id, sets:blankSets(EXBY[id], rx(EXBY[id],p).sets)})) : [],
    cardioMin:'', effort:'', notes:'',
  };
}
function lastFor(id){
  for(const w of S.workouts){ const e=w.exercises.find(x=>x.id===id); if(e && e.sets.length) return {date:w.date, sets:e.sets}; }
  return null;
}
function fmtSet(s, ex){
  if(ex.p==='cardio') return `${s.r} min`;
  if(ex.t) return `${s.r}s`;
  return s.w ? `${s.w}×${s.r}` : `${s.r} reps`;
}
function setFields(ex){ return ex.p==='cardio' ? [['r','min']] : ex.t ? [['r','sec']] : [['w','lb'],['r','reps']]; }

function viewLog(){
  const p = profile();
  if(!S.draft) S.draft = null;
  const d = S.draft;
  const pl = plan();
  if(!d){
    const todayDow = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][new Date().getDay()];
    const todayIdx = pl ? pl.days.findIndex(x=>x.weekday===todayDow) : -1;
    $('#app').innerHTML = `
      <div class="card"><h2>Log a workout</h2>
        ${pl ? `<p class="muted small" style="margin-top:0">Pick a day from your plan${todayIdx>=0?` — today is <b style="color:var(--text)">${pl.days[todayIdx].name}</b>`:''}.</p>
        <div style="display:grid;gap:8px">${pl.days.map((x,i)=>`<button class="btn ${i===todayIdx?'primary':''} block" data-d="${i}" style="text-align:left;display:flex;gap:10px;align-items:center"><span class="dow" style="${i===todayIdx?'background:var(--accent-ink);color:var(--accent)':''}">${x.weekday}</span>${x.name}</button>`).join('')}</div>
        <div style="margin-top:8px"><button class="btn ghost block" data-d="custom">Start a custom workout</button></div>`
        : `<p class="muted">Set up your profile first to get a plan — or log a custom workout.</p><button class="btn block" data-d="custom">Start a custom workout</button>`}
      </div>`;
    $('#app').querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{ startDraft(b.dataset.d==='custom'?null:+b.dataset.d); viewLog(); });
    return;
  }
  const options = Object.keys(PATTERN_LABEL).map(pat=>`<optgroup label="${PATTERN_LABEL[pat]}">${EX.filter(e=>e.p===pat).map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('')}</optgroup>`).join('');
  $('#app').innerHTML = `
    <div class="card">
      <div class="row" style="justify-content:space-between"><h2 style="margin:0">${esc(d.dayName)}</h2><button class="btn sm ghost" id="cancel">Cancel</button></div>
      <label class="f" for="ldate">Date</label><input type="date" id="ldate" value="${d.date}" max="${todayStr()}">
    </div>
    <div id="exlist">${d.exercises.map((e,i)=>logExHtml(e,i,p)).join('') || '<div class="card empty small">No exercises yet — add one below.</div>'}</div>
    <div class="card">
      <label class="f" for="addex" style="margin-top:0">Add an exercise</label>
      <select id="addex"><option value="">Choose…</option>${options}</select>
      <div class="grid2">
        <div><label class="f" for="cmin">Extra cardio (min)</label><input type="number" inputmode="numeric" id="cmin" min="0" value="${esc(d.cardioMin)}"></div>
        <div><label class="f" for="effort">Effort (1–10)</label><input type="number" inputmode="numeric" id="effort" min="1" max="10" value="${esc(d.effort)}"></div>
      </div>
      <label class="f" for="lnotes">Notes</label><textarea id="lnotes" placeholder="How did it feel? Any pain or wins?">${esc(d.notes)}</textarea>
      <div id="lerr" class="small" style="color:var(--danger);margin-top:10px"></div>
      <button class="btn primary block" id="savew" style="margin-top:10px">Save workout</button>
    </div>`;
  $('#cancel').onclick = ()=>{ S.draft=null; viewLog(); };
  $('#ldate').onchange = e=> d.date = e.target.value || todayStr();
  $('#cmin').oninput = e=> d.cardioMin = e.target.value;
  $('#effort').oninput = e=> d.effort = e.target.value;
  $('#lnotes').oninput = e=> d.notes = e.target.value;
  $('#addex').onchange = e=>{ const id=e.target.value; if(!id) return; d.exercises.push({id, sets:blankSets(EXBY[id], p?rx(EXBY[id],p).sets:3)}); viewLog(); setTimeout(()=>document.querySelectorAll('.logex')[d.exercises.length-1]?.scrollIntoView({behavior:'smooth',block:'center'}),50); };
  const list = $('#exlist');
  list.addEventListener('input', e=>{ const t=e.target; if(t.dataset.f==null) return; const [i,s]=[+t.dataset.i,+t.dataset.s]; d.exercises[i].sets[s][t.dataset.f]=t.value; });
  list.addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b) return;
    const i = +b.dataset.i;
    if(b.dataset.act==='addset'){ const sets=d.exercises[i].sets; const last=sets[sets.length-1]; sets.push({w:last?last.w:'',r:last?last.r:''}); viewLogKeep(); }
    if(b.dataset.act==='delset'){ d.exercises[i].sets.splice(+b.dataset.s,1); viewLogKeep(); }
    if(b.dataset.act==='delex'){ d.exercises.splice(i,1); viewLogKeep(); }
    if(b.dataset.act==='copy'){ const L=lastFor(d.exercises[i].id); if(L){ d.exercises[i].sets = L.sets.map(s=>({w:s.w??'',r:s.r??''})); viewLogKeep(); } }
  });
  $('#savew').onclick = saveWorkout;
}
function viewLogKeep(){ const y=window.scrollY; viewLog(); window.scrollTo(0,y); }
function logExHtml(e, i, p){
  const ex = EXBY[e.id], L = lastFor(e.id), fields = setFields(ex), target = p ? rx(ex,p).text : '';
  return `<div class="logex">
    <div class="top"><div class="t"><div style="font-weight:600">${esc(ex.name)}</div>
      <div class="hint">${target?`Target ${target}`:''}${L?`${target?' · ':''}Last (${L.date.slice(5).replace('-','/')}): ${L.sets.map(s=>fmtSet(s,ex)).join(', ')}`:''}</div></div>
      <button class="iconbtn" data-act="delex" data-i="${i}" aria-label="Remove exercise">✕</button></div>
    <div class="sets">${e.sets.map((s,si)=>`<div class="setrow ${fields.length===1?'one':''}"><div class="n">${si+1}</div>
      ${fields.map(([f,ph])=>`<input type="number" inputmode="decimal" min="0" placeholder="${ph}" aria-label="Set ${si+1} ${ph}" data-i="${i}" data-s="${si}" data-f="${f}" value="${esc(s[f])}">`).join('')}
      <button class="x" data-act="delset" data-i="${i}" data-s="${si}" aria-label="Remove set">×</button></div>`).join('')}</div>
    <div class="row" style="margin-top:8px"><button class="btn sm" data-act="addset" data-i="${i}">+ Set</button>${L?`<button class="btn sm ghost" data-act="copy" data-i="${i}">Copy last time</button>`:''}</div>
  </div>`;
}
async function saveWorkout(){
  const d = S.draft;
  const exercises = d.exercises.map(e=>({id:e.id, name:EXBY[e.id].name, pattern:EXBY[e.id].p,
    sets:e.sets.filter(s=>num(s.r)>0).map(s=>{ const o={r:num(s.r)}; if(num(s.w)>0) o.w=num(s.w); return o; })})).filter(e=>e.sets.length);
  const cardioMin = num(d.cardioMin);
  if(!exercises.length && !cardioMin){ $('#lerr').textContent = 'Enter reps (or time) for at least one set before saving.'; return; }
  const w = { date:d.date, dayName:d.dayName, exercises, cardioMin, effort:Math.min(10,num(d.effort))||null, notes:d.notes.trim(), createdAt:Date.now() };
  const btn = $('#savew'); btn.disabled = true; btn.textContent = 'Saving…';
  try{
    const id = await S.store.addWorkout(w);
    S.workouts.unshift({...w,id}); S.workouts.sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt-a.createdAt);
    S.draft = null; toast('Workout saved 💪'); go('progress');
  }catch(e){ console.error(e); btn.disabled=false; btn.textContent='Save workout'; $('#lerr').textContent = e && e.code==='quota_exceeded' ? 'Storage is full — delete some old workouts first.' : 'Couldn’t save — check your connection and try again.'; }
}

// ----- progress -----
function viewProgress(){
  const p = profile(), W = S.workouts, target = p ? +p.days : 3;
  if(!W.length){ $('#app').innerHTML = `<div class="card empty"><h2>No workouts yet</h2><p>Log your first session and your progress shows up here.</p><button class="btn primary" onclick="go('log')">Log a workout</button></div>`; return; }
  const now = new Date(), thisWk = weekStart(now).getTime();
  const weeks = []; for(let i=7;i>=0;i--){ const s=weekStart(now); s.setDate(s.getDate()-7*i); weeks.push({start:s, n:0}); }
  const byWeek = new Map(weeks.map(w=>[w.start.getTime(),w]));
  for(const w of W){ const k=weekStart(parseYmd(w.date)).getTime(); if(byWeek.has(k)) byWeek.get(k).n++; }
  const thisCount = byWeek.get(thisWk).n;
  // streak: consecutive weeks hitting target, counting back from last week (plus this week if already hit)
  const counts = new Map(); for(const w of W){ const k=weekStart(parseYmd(w.date)).getTime(); counts.set(k,(counts.get(k)||0)+1); }
  let streak = thisCount>=target?1:0; const cur = weekStart(now);
  for(;;){ cur.setDate(cur.getDate()-7); if((counts.get(cur.getTime())||0)>=target) streak++; else break; }
  const since = new Date(now); since.setDate(since.getDate()-30); const sinceS = ymd(since);
  let vol=0; for(const w of W) if(w.date>=sinceS) for(const e of w.exercises) for(const s of e.sets) if(s.w) vol+=s.w*s.r;
  // personal bests
  const pr = {};
  for(const w of W) for(const e of w.exercises){ const ex=EXBY[e.id]||{p:e.pattern,t:false};
    for(const s of e.sets){ const cur=pr[e.id]||(pr[e.id]={name:e.name,ex,best:null,score:-1,date:w.date});
      const score = s.w ? s.w*(1+s.r/30) : s.r;
      const kind = s.w ? 'w' : 'bw';
      if(cur.kind==='w' && kind==='bw') continue;
      if(score>cur.score || (kind==='w' && cur.kind!=='w')){ Object.assign(cur,{best:s,score,date:w.date,kind}); } } }
  const prs = Object.values(pr).filter(x=>x.ex.p!=='cardio').sort((a,b)=>a.name.localeCompare(b.name));
  // chart
  const maxN = Math.max(target, ...weeks.map(w=>w.n), 1), H=120, bw=28, gap=12, Wd=weeks.length*(bw+gap);
  const y = n => H - (n/maxN)*(H-18);
  const chart = `<svg viewBox="0 0 ${Wd} ${H+22}" width="100%" role="img" aria-label="Workouts per week, last 8 weeks">
    <line x1="0" x2="${Wd}" y1="${y(target)}" y2="${y(target)}" stroke="#ffb547" stroke-dasharray="4 4" stroke-width="1.5"/>
    <text x="${Wd}" y="${y(target)-4}" fill="#ffb547" font-size="10" text-anchor="end">goal ${target}</text>

async function resetAccount(b){

  if(!b.dataset.armed){
    document.querySelectorAll('[data-reset]').forEach(x=>{ delete x.dataset.armed; x.textContent = x.dataset.reset==='all'?'Erase everything':'Redo setup'; });

  document.querySelectorAll('[data-reset]').forEach(x=>x.disabled=true);
  try{
    if(all){ await S.store.replaceAll({}, []); await S.store.clearDays(); S.workouts = []; S.days = {}; }
    else { await S.store.saveAccount(S.account.nutrition ? {nutrition:S.account.nutrition} : {}); }

function coachSystemPrompt(){
  return `You are the Busy Bodies coach: a friendly, practical fitness coach inside a workout-tracker web app for busy working parents. You are talking with the app's user on their phone.

STYLE
- Warm, encouraging, direct. Short answers: usually 2–5 sentences or a short bullet list. Use **bold** sparingly and "- " for bullets.
- Respect that time and energy are limited: offer quick versions (10–20 min), home options, and ways to fit workouts around kids and work.
- Use the user's name occasionally if known.

ONBOARDING MODE (when there is no profile)
- Collect, one or two questions at a time, in a natural conversation: name; age; sex (male/female, only used for the calorie formula — explain briefly if asked); height (feet + inches); weight (lb); main goal; experience; workouts per week; minutes per workout; what equipment they can use (at home and/or a gym); what cardio they can or like to do; whether they need low-impact (no jumping/running); and helpful context (work schedule, kids, best times to train, injuries, likes/dislikes).
- Map answers to allowed values: goal ∈ fat_loss | muscle | strength | endurance | general; level ∈ 1 (beginner) | 2 (intermediate) | 3 (advanced); days ∈ 2–6; minutes ∈ 30 | 45 | 60 (round to nearest); gear = array of any of: ${Object.entries(GEAR).map(([k,l])=>`${k} (${l})`).join(', ')} — empty array means bodyweight only; activities = array of any of: ${Object.entries(ACTIVITIES).map(([k,l])=>`${k} (${l})`).join(', ')}; lowImpact true/false. "Full gym" usually means all equipment plus treadmill, bike, elliptical and rower. If an answer is unclear, ask. Suggest a sensible default if they're unsure (e.g. 3 days, 30–45 minutes for busy parents).
- When you have everything required, put the complete profile in "profile" (fields: name, age, sex, heightFt, heightIn, weight, goal, level, days, minutes, gear, activities, lowImpact, notes). "notes" is a short summary of their context (schedule, kids, injuries, preferences). In "reply", briefly summarize and say their plan is ready on the Plan tab. Until then, "profile" must be null.

COACHING MODE (profile exists)
- Use the PROFILE, PLAN and RECENT WORKOUTS below to give specific advice: what to do today, quick swaps, progression (when they hit the top of the rep range, add 5 lb or reps), recovery, consistency, motivation.
- You may propose changes as "actions" the user can tap to apply. Only propose an action when it clearly helps; explain it in "reply". Allowed actions:
  {"type":"swap_exercise","day":<day index>,"from":"<exercise id in that day>","to":"<exercise id from the library>","label":"Swap X for Y on Monday"}
  {"type":"update_profile","changes":{<any of: days, minutes, gear, activities, goal, level, lowImpact, weight, notes>},"label":"..."}  (gear/activities are the FULL new arrays)
  {"type":"regenerate_plan","label":"Shuffle in new exercises"}
- EQUIPMENT RULE: only recommend exercises from the library below and cardio from AVAILABLE CARDIO — this applies to everything you write, not just actions. The library already contains only what this user can do. If the user wants something that needs equipment or an activity they don't have, say so and offer an update_profile action that adds it (e.g. they mention they joined a gym or bought a kettlebell).
- For swaps, use the same movement pattern when possible. Use ONLY ids from the library.
- When the user shares lasting info (new injury, schedule change, preference), propose an update_profile action with updated "notes" (keep the old notes and add the new info).
- Nutrition: the app has a Nutrition tab where the user logs meals (calories/protein), water and supplements. Give general, sensible guidance (protein, simple meals for busy families, hydration, the calorie estimate). Don't recommend specific supplement doses; suggest checking with a doctor or pharmacist.

SAFETY
- You are not a doctor. For pain: tell them to stop any movement that hurts, offer a pain-free alternative, and recommend seeing a doctor or physical therapist for sharp, worsening, or lasting pain, or any chest pain, dizziness or shortness of breath (urgent care for those).
- Never recommend extreme diets, very low calories, or training through injury.

OUTPUT
Respond with ONLY a JSON object, no markdown fences:
{"reply": "<message to the user>", "profile": <object or null>, "actions": [<zero or more actions>]}

EXERCISE LIBRARY — ${profile() ? 'only what this user can do' : 'all exercises'} (id | name | pattern | level | needs):
${libForPrompt(profile())}

CURRENT USER DATA
${coachContext()}`;
}

async function getCoachModel(name, system){
  if(!S.aiMod){ S.aiMod = await import(FB.base+'firebase-ai.js'); S.ai = S.aiMod.getAI(FB.app, {backend: new S.aiMod.GoogleAIBackend()}); }
  const generationConfig = { responseMimeType:'application/json', temperature:0.6 };
  // Gemini 3 "thinks" before answering; keep it low so replies come back fast.
  if(!S.noThinkCfg) generationConfig.thinkingConfig = { thinkingLevel: (S.aiMod.ThinkingLevel && S.aiMod.ThinkingLevel.LOW) || 'LOW' };
  return S.aiMod.getGenerativeModel(S.ai, { model: name, systemInstruction: system ?? coachSystemPrompt(), generationConfig });
}
const askCoach = contents => askAI(contents, coachSystemPrompt());
// Sends a request to Gemini (any feature). Tries each model in COACH_MODELS until one answers; remembers the one that worked.
async function askAI(contents, system, perModelMs=30000){
  S.stage = 'loading AI module';
  await getCoachModel(COACH_MODELS[0]);
  if(FB.appCheck && !S.appCheckOk){
    S.stage = 'App Check token';
    const t = await withTimeout(FB.AC.getToken(FB.appCheck, false), 15000).catch(e=>{ throw new Error('App Check: '+(e.message||e)); });
    if(t && t.error) throw new Error('App Check: '+(t.error.message||t.error));
    S.appCheckOk = true;
  }
  S.stage = 'waiting for Gemini';
  const list = S.goodModel ? [S.goodModel, ...COACH_MODELS.filter(n=>n!==S.goodModel)] : COACH_MODELS;
  const log = [];
  for(const name of list){
    const t0 = Date.now();
    S.stage = 'waiting for ' + name;
    try{
      const model = await getCoachModel(name, system);
      const res = await withTimeout(model.generateContent({contents}), perModelMs);
      S.goodModel = name; S.lastTimings = `${name} ${Math.round((Date.now()-t0)/1000)}s`;
      return res.response.text();
    }catch(e){
      const m = String(e&&e.message||e);
      const secs = Math.round((Date.now()-t0)/1000);
      // If this SDK/model rejects the thinking setting, retry once without it.
      if(/thinking/i.test(m) && !S.noThinkCfg){ S.noThinkCfg = true; return askAI(contents, system, perModelMs); }
      log.push(`${name}: ${/timeout/.test(m)?`no reply in ${perModelMs/1000}s`:m.replace(/^.*?generateContent:\s*/,'').slice(0,90)} (${secs}s)`);
      if(S.goodModel===name) S.goodModel = null;
      // anything other than slow / busy / missing model is a real error — stop here
      if(!/timeout|not found|404|is not supported|NOT_FOUND|\b50[0-9]\b|high demand|overloaded|UNAVAILABLE|try again later/i.test(m)) break;
    }
  }
  const err = new Error(log.join(' | ')); err.attempts = log; throw err;
}
function parseCoach(text){
  let t = (text||'').trim().replace(/^```(?:json)?\s*/i,'').replace(/```$/,'').trim();
  try{ const o = JSON.parse(t); return { reply: String(o.reply||'').trim() || '…', profile: o.profile && typeof o.profile==='object' ? o.profile : null, actions: Array.isArray(o.actions) ? o.actions.slice(0,4) : [] }; }
  catch{ return { reply: t || 'Sorry, I lost my train of thought — could you say that again?', profile:null, actions:[] }; }
}
function greeting(){
  const p = profile();
  if(!p) return `Hi! I'm your Busy Bodies coach. 👋 I'll ask a few quick questions and build a workout plan that fits your schedule.\n\nFirst up — **what should I call you, and how old are you?**`;
  return `Hey${p.name?' '+p.name:''}! Ask me anything — what to do today, a quick workout when time is tight, a swap for something that hurts, or how your week is going.`;
}
function mdLite(s){
  const lines = esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|\s)_(.+?)_(?=\s|$)/g,'$1<span class="small muted">$2</span>').split('\n');
  let out='', inList=false;
  for(const l of lines){
    const m = l.match(/^\s*[-•*]\s+(.*)/);
    if(m){ if(!inList){ out+='<ul>'; inList=true; } out+=`<li>${m[1]}</li>`; }
    else { if(inList){ out+='</ul>'; inList=false; } out += l ? l+'<br>' : '<br>'; }
  }
  if(inList) out+='</ul>';
  return out.replace(/(<br>)+$/,'');
}

function validateAction(a){
  const p = profile(), pl = plan();
  if(!a || !p || !pl) return null;
  if(a.type==='swap_exercise'){
    const d = pl.days[+a.day], to = EXBY[a.to];
    if(!d || !d.exercises.includes(a.from) || !to || !canDo(to,p) || d.exercises.includes(a.to)) return null;
    return {...a, label: a.label || `Swap ${EXBY[a.from].name} for ${to.name} (${d.weekday})`};
  }
  if(a.type==='update_profile' && a.changes && typeof a.changes==='object'){
    const allowed = ['days','minutes','gear','activities','goal','level','lowImpact','weight','notes'];
    const changes = Object.fromEntries(Object.entries(a.changes).filter(([k])=>allowed.includes(k)));
    if(!Object.keys(changes).length) return null;
    return {...a, changes, label: a.label || 'Update my profile'};
  }
  if(a.type==='regenerate_plan') return {...a, label: a.label || 'Shuffle in new exercises'};
  return null;
}
async function applyAction(a){
  const p = profile();
  if(a.type==='swap_exercise'){ const d = plan().days[+a.day]; d.exercises[d.exercises.indexOf(a.from)] = a.to; await saveAccount(); return `Swapped in ${EXBY[a.to].name}`; }
  if(a.type==='regenerate_plan'){ S.account.plan = buildPlan(p, Math.floor(Math.random()*1e9)); await saveAccount(); return 'New exercises are on your Plan tab'; }
  if(a.type==='update_profile'){
    const {p:np, err} = normalizeProfile({...p, ...a.changes});
    if(err.length) return 'That change didn’t look right, so I skipped it';
    const {changed} = await applyProfile(np);
    return changed ? 'Profile updated — your plan was adjusted' : 'Profile updated';
  }
}

function viewCoach(){
  if(!FB){ $('#app').innerHTML = `<div class="card empty"><h2>Coach is offline</h2><p>The coach needs an internet connection. Check your connection and reload.</p></div>`; return; }
  if(!S.user){
    $('#app').innerHTML = `<div class="card signin"><h2>Meet your coach</h2><p class="muted">Sign in to chat with your Busy Bodies coach. It can set up your plan for you, answer questions, and adjust your workouts around your week.</p><button class="btn gbtn" data-signin>${GOOGLE_G} Sign in with Google</button></div>`;
    bindAccountCard(); return;
  }
  const msgs = S.chat.length ? S.chat : [{role:'model', text:greeting(), ts:Date.now(), seed:true}];
  $('#app').innerHTML = `
    <div class="row" style="justify-content:space-between;margin-bottom:10px"><h2 style="margin:0">Coach</h2>${S.chat.length?'<button class="btn sm ghost" id="clearChat">Clear chat</button>':''}</div>
    <div class="chat" id="chat">${msgs.map((m,i)=>msgHtml(m,i)).join('')}${S.coachBusy?'<div class="typing" id="typing">Coach is typing…</div>':''}</div>
    <div class="composer"><div class="inner">
      ${profile()?`<div class="chips">${COACH_STARTERS.map(s=>`<span class="chip" data-q="${esc(s)}">${esc(s)}</span>`).join('')}</div>`:''}
      <form id="coachForm"><textarea id="coachIn" rows="1" placeholder="${profile()?'Ask your coach…':'Type your answer…'}" ${S.coachBusy?'disabled':''}></textarea>
      <button class="btn primary" aria-label="Send" ${S.coachBusy?'disabled':''}><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></form>
    </div></div>`;
  const ta = $('#coachIn');
  if(S.lastFailed && !S.coachBusy) ta.value = S.lastFailed;
  ta.addEventListener('input', ()=>{ ta.style.height='auto'; ta.style.height=Math.min(ta.scrollHeight,120)+'px'; });
  ta.addEventListener('keydown', e=>{ if(e.key==='Enter' && !e.shiftKey && window.matchMedia('(pointer:fine)').matches){ e.preventDefault(); $('#coachForm').requestSubmit(); } });
  $('#coachForm').onsubmit = e=>{ e.preventDefault(); const t=ta.value.trim(); if(t) sendCoach(t); };
  document.querySelectorAll('[data-q]').forEach(c=>c.onclick=()=>sendCoach(c.dataset.q));
  $('#clearChat')?.addEventListener('click', async e=>{
    const b=e.currentTarget; if(!b.dataset.armed){ b.dataset.armed='1'; b.textContent='Tap again to clear'; return; }
    S.chat=[]; await S.store.saveChat([]); viewCoach();
  });
  $('#chat').querySelectorAll('[data-act]').forEach(b=>b.onclick=async ()=>{
    const [mi,ai] = b.dataset.act.split(':').map(Number); const a = S.chat[mi]?.actions?.[ai]; if(!a || a.applied) return;
    b.disabled = true;
    const v = validateAction(a); if(!v){ toast('That change no longer fits your plan'); b.disabled=false; return; }
    const msg = await applyAction(v); a.applied = true; await S.store.saveChat(S.chat).catch(()=>{}); toast(msg); viewCoach();
  });
  window.scrollTo(0, document.body.scrollHeight);
}
function msgHtml(m, i){
  const acts = (m.actions||[]).map((a,ai)=> a.applied ? `<div class="done">✓ ${esc(a.label)}</div>` : `<button class="btn sm" data-act="${i}:${ai}">Apply: ${esc(a.label)}</button>`).join('');
  return `<div class="msg ${m.role}">${m.role==='model'?mdLite(m.text):esc(m.text).replace(/\n/g,'<br>')}${acts?`<div class="acts">${acts}</div>`:''}</div>`;
}

async function sendCoach(text){
  if(S.coachBusy) return;
  S.chat = S.chat.filter(m=>!m.transient); S.lastFailed = '';
  loadDay(todayStr()).catch(()=>{}); // so the coach can see today's nutrition
  if(!S.chat.length) S.chat.push({role:'model', text:greeting(), ts:Date.now()});
  S.chat.push({role:'user', text, ts:Date.now()});
  S.coachBusy = true; viewCoach();
  const started = Date.now();
  const tick = setInterval(()=>{ const el=$('#typing'); if(!el) return; const sec=Math.round((Date.now()-started)/1000); el.textContent = sec<8 ? 'Coach is typing…' : `Coach is typing… ${sec}s${S.stage&&S.stage.startsWith('waiting for gemini-')&&S.stage!=='waiting for '+COACH_MODELS[0]?' (trying a backup model)':''}`; }, 1000);
  let out;
  try{
    let hist = S.chat.slice(-24).map(m=>({role:m.role==='model'?'model':'user', parts:[{text:m.text}]}));
    while(hist.length && hist[0].role!=='user') hist.shift();
    // keep the coach's opening question in view so onboarding answers make sense
    if(S.chat.length<=24 && S.chat[0].role==='model') hist.unshift({role:'user',parts:[{text:'(Opened the coach.)'}]},{role:'model',parts:[{text:S.chat[0].text}]});
    out = parseCoach(await withTimeout(askCoach(hist), 100000));
  }catch(e){
    console.error(e);
    const m = String(e && (e.message||e.code)||'');
    const detail = (e && e.attempts ? m : m + (S.stage?` (step: ${S.stage})`:'')).slice(0,400);
    const reply = /no reply in 30s|timeout/i.test(m) && !/high demand|50[0-9]/.test(m) ? 'Gemini is being slow right now and didn’t answer in time.' :
                  /app.?check|attestation|unauthenticated|401/i.test(m) ? 'I’m almost ready — Firebase is blocking me until **App Check** is set up for this site.' :
                  /api-not-enabled|not been used|PERMISSION_DENIED|403/i.test(m) ? 'I’m not switched on yet — in the Firebase console, open **AI Logic** and click **Get started** with the Gemini Developer API.' :
                  /high demand|overloaded|\b50[0-9]\b|UNAVAILABLE/i.test(m) ? 'Google’s AI is really busy right now — give it a minute and try again.' :
                  /quota|429|RESOURCE_EXHAUSTED/i.test(m) ? 'I’ve hit my free usage limit for now — try again in a little while.' :
                  /not found|404/i.test(m) ? 'The AI model I use isn’t available right now. (Developer note: update COACH_MODELS.)' :
                  'Sorry — I couldn’t connect just now. Check your connection and try again.';
    out = {reply: reply + `\n\n_Details: ${detail}_`, profile:null, actions:[], error:true};
  }
  const msg = {role:'model', text:out.reply, ts:Date.now()};
  // onboarding: coach collected a full profile
  if(out.profile && !profile()){
    const {p, err} = normalizeProfile(out.profile);
    if(!err.length){ await applyProfile(p); msg.text += '\n\n✓ **Your plan is ready** — check the Plan tab.'; toast('Your plan is ready'); }
    else msg.text += `\n\n(I still need your ${err.join(' and ')}.)`;
  }
  const acts = out.actions.map(validateAction).filter(Boolean).map(a=>({...a, applied:false}));
  if(acts.length) msg.actions = acts;
  clearInterval(tick);
  S.chat.push(msg);
  S.coachBusy = false;
  if(out.error){ S.chat.splice(-2, 2); S.chat.push({...msg, text: out.reply + '\n\nYour message is back in the box — tap send to try again.', transient:true}); S.lastFailed = text; }
  try{ await S.store.saveChat(S.chat.filter(m=>!m.transient)); }catch(e){ console.warn(e); }
  if(location.hash==='#coach') viewCoach();
}

// ---------- init ----------
async function init(){
  try{ FB = await withTimeout(loadFirebase(), 12000); }catch(e){ console.warn('Firebase unavailable — saving in this browser', e); FB = null; }
  if(!FB){ await useLocal(); return; }
  let first = true;
  FB.A.onAuthStateChanged(FB.auth, async user=>{
    if(user) await useCloud(user);
    else await useLocal();
    first = false;
  });
}
window.go = go;
// Installable app: register the service worker (works on https only, e.g. GitHub Pages).
if('serviceWorker' in navigator && location.protocol==='https:'){
  window.addEventListener('load', ()=>navigator.serviceWorker.register('./sw.js').catch(e=>console.warn('SW failed', e)));
}
// Running from the home screen?
S.standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
window.addEventListener('hashchange', route);
init();
</script>
